name: daily_ingest_batch

on:
  schedule: [{ cron: "7 23 * * *" }]   # 23:07 UTC, before issue time 23:20
  workflow_dispatch:                   # manual "Run workflow" button

permissions:
  contents: read
  id-token: write                      # OIDC token for Workload Identity Federation

env:
  STORAGE_BACKEND: gcs
  GCS_BUCKET: ${{ vars.GCS_BUCKET }}
  POSTGRES_HOST: 127.0.0.1             # Cloud SQL Auth Proxy, started in step 3
  POSTGRES_PORT: "5432"
  POSTGRES_DB: swgr
  POSTGRES_USER: sharedUser
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # 1 · unit tests, no cloud access needed
      - run: uv sync --locked && uv run python -m pytest tests -q

      # 2 · sign in to GCP without a stored key
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      # 3 · tunnel to Cloud SQL on 127.0.0.1:5432 (runs until the job ends)
      - run: |
          curl -sSfLo cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.26.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "${{ vars.CLOUDSQL_INSTANCE }}" &
          timeout 60 bash -c 'until pg_isready -h 127.0.0.1 -p 5432; do sleep 2; done'

      # 4 + 5 · ingest (raw CSV to GCS, rows to Cloud SQL) and transform
      - run: uv run python -m src.ingestion.energy_balance all
      - run: uv run python -m src.ingestion.transform

      # 6 · smoke test: features reach the last 3 hours
      - run: |
          PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -c \
            "SELECT max(ts_utc) > now() - interval '3 hours' FROM features.control_area_features" \
            | grep -qx t