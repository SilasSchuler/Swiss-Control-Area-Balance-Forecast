[project]
name = "swiss-control-area-balance-forecast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.114",
    "dotenv>=0.9.9",
    "ipykernel>=7.3.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg2>=2.9.13",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
